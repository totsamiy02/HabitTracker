name: Android

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-37' 'build-tools;36.0.0'
      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  release:
    name: Publish signed APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    permissions:
      contents: write
    concurrency:
      group: habittracker-releases
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-37' 'build-tools;36.0.0'
      - name: Build release
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify version and sign APK
        id: apk
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HABITTRACKER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HABITTRACKER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing HABITTRACKER_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing HABITTRACKER_KEYSTORE_PASSWORD}"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          input="app/build/outputs/apk/release/app-release-unsigned.apk"
          metadata="$("$build_tools/aapt2" dump badging "$input")"
          read -r package version_code version_name <<< "$(awk -F"'" '/^package:/ { print $2, $4, $6; exit }' <<< "$metadata")"
          [[ "$package" == com.yaroslav.habittracker ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset="HabitTracker-$version_name-build$version_code.apk"
          tag="v$version_name"

          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/habittracker-signing.XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias habittracker --ks-pass env:KEYSTORE_PASSWORD \
            --out "$asset" "$input"
          "$build_tools/apksigner" verify --print-certs "$asset"

          printf 'asset=%s\ntag=%s\ncode=%s\nversion=%s\n' "$asset" "$tag" "$version_code" "$version_name" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.asset }}
          TAG: ${{ steps.apk.outputs.tag }}
          VERSION_CODE: ${{ steps.apk.outputs.code }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
        run: |
          set -euo pipefail
          previous_codes="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq             '.[] | select(.draft == false and .prerelease == false) | .assets[].name | select(test("^HabitTracker-[0-9]+[.][0-9]+[.][0-9]+-build[0-9]+[.]apk$")) | capture("-build(?<code>[0-9]+)[.]apk$").code')"
          if [[ -n "$previous_codes" ]]; then
            while IFS= read -r previous_code; do
              if (( 10#$previous_code >= 10#$VERSION_CODE )); then
                printf '%s\n' 'versionCode must be greater than all published versions.' >&2
                exit 1
              fi
            done <<< "$previous_codes"
          fi

          notes="$RUNNER_TEMP/habittracker-release.md"
          awk -v version="$VERSION_NAME" '
            /^## / {
              if (active) exit
              active = ($2 == version)
              next
            }
            active { print }
          ' docs/CHANGELOG.md > "$notes"
          if ! grep -q '^[[:space:]]*-' "$notes"; then
            printf '%s\n' 'Missing release notes in docs/CHANGELOG.md.' >&2
            exit 1
          fi

          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "HabitTracker $VERSION_NAME" --notes-file "$notes" --latest
